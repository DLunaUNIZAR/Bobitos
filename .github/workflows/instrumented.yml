name: Instrumented tests

on:
  pull_request:
    paths: &paths
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/instrumented.yml'
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Sigue aceptando las licencias para que AGP descargue el platform de
      # compileSdk 37; sin `packages` pediría `tools`, retirado del repositorio del SDK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compila antes de arrancar el emulador para que no espere a la compilación.
      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Sin caché de AVD ni reintentos, según docs/adr/0001-tests-instrumentados-en-la-ci.md.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 37.0
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
          if-no-files-found: warn
